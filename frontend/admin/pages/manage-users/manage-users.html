<!DOCTYPE html>
<html>

<head>
    <title>Manage Users</title>
    <link rel="stylesheet" href="../../assets/css/manage-users.css">
</head>

<body>

    <div class="admin-layout">

        <div class="main-area">

            <header class="admin-header">
                <h1>User Management</h1>
                <button onclick="goHome()" class="back-to-home">Back to Home</button>
            </header>

            <div class="content-wrapper">
                <div class="card">
                    <input type="text" id="userSearch" class="search-input" placeholder="Search users..."
                        oninput="filterUsers()" />
                    <div id="userTable"></div>
                </div>
            </div>

        </div>

        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <p id="deleteMessage"></p>


                <div class="modal-buttons">
                    <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                    <button class="delete-btn" onclick="confirmDelete()">Delete</button>
                </div>
            </div>

        </div>

    </div>

    <script src="../../assets/js/manage-users.js"></script>

</body>

</html>
